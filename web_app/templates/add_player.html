{% extends "base.html" %}

{% block title %}Додати гравця — VolleyVision{% endblock %}

{% block content %}
<header class="page-header">
    <div>
        <h1>Новий гравець</h1>
        <p>Додай учасника до складу волейбольної команди</p>
    </div>
    <a class="button" href="{{ url_for('players') }}">← До гравців</a>
</header>

<section class="form-card">
    <h2>👤 Інформація про гравця</h2>

    <form method="POST" action="{{ url_for('add_player') }}">
        <label>
            Ім'я та прізвище
            <input
                type="text"
                name="name"
                placeholder="Наприклад, Арсеній Лахтін"
                required
                maxlength="100"
            >
        </label>

        <div class="form-grid">
            <label>
                Вік
                <input
                    type="number"
                    name="age"
                    min="10"
                    max="60"
                    placeholder="18"
                    required
                >
            </label>

            <label>
                Номер гравця
                <input
                    type="number"
                    name="number"
                    min="1"
                    max="99"
                    placeholder="7"
                    required
                >
            </label>
        </div>

        <label>
            Ігрова позиція
            <select name="position" required>
                <option value="">Обери позицію</option>
                <option value="Догравальник">Догравальник</option>
                <option value="Діагональний">Діагональний</option>
                <option value="Центральний блокуючий">Центральний блокуючий</option>
                <option value="Зв'язуючий">Зв'язуючий</option>
                <option value="Ліберо">Ліберо</option>
            </select>
        </label>

        <div class="form-actions">
            <button type="submit">✓ Зберегти гравця</button>
            <a class="button button-secondary"
               href="{{ url_for('players') }}">Скасувати</a>
        </div>
    </form>
</section>
{% endblock %}
